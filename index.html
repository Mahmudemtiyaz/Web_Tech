<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Club Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>University Club Membership Registration</h1>

        <form id="clubForm">

            <label for="firstName">First Name</label>
            <input type="text" id="firstName">
            <small class="error" id="firstNameError"></small>


            <label for="lastName">Last Name</label>
            <input type="text" id="lastName">
            <small class="error" id="lastNameError"></small>


            <label for="email">Email Address</label>
            <input type="email" id="email">
            <small class="error" id="emailError"></small>


            <label for="password">Password</label>
            <input type="password" id="password">
            <small class="error" id="passwordError"></small>


            <label>Gender</label>

            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other

            <small class="error" id="genderError"></small>


            <label>Interested Clubs</label>

            <input type="checkbox" name="club" value="Programming"> Programming
            <input type="checkbox" name="club" value="Robotics"> Robotics
            <input type="checkbox" name="club" value="Sports"> Sports
            <input type="checkbox" name="club" value="Cultural"> Cultural

            <small class="error" id="clubError"></small>


            <label for="category">Club Category</label>

            <select id="category">

                <option value="">Select Category</option>
                <option value="Technical">Technical</option>
                <option value="Sports">Sports</option>
                <option value="Cultural">Cultural</option>
                <option value="Social">Social</option>

            </select>

            <small class="error" id="categoryError"></small>


            <label for="reason">
                Why do you want to join?
            </label>

            <textarea id="reason" rows="5"></textarea>

            <small class="error" id="reasonError"></small>


            <button type="submit">
                Register
            </button>

        </form>

    </div>

    <script src="script.js"></script>

</body>

</html>
